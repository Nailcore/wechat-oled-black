plugins { id 'com.android.application' }

android {
    namespace 'io.github.wxoled'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.wxoled'
        minSdk 28
        targetSdk 36
        versionCode 29
        versionName '1.5.23'
